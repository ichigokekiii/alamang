name = "alamang"
main = "src/index.mjs"
compatibility_date = "2026-11-11"

[assets]
directory = "web/public"
binding = "ASSETS"
run_worker_first = true

[vars]
HASH_SALT = "alamang-local"

[[d1_databases]]
binding = "DB"
database_name = "alamang"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
